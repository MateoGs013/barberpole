<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="barber-stripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="7" height="20" fill="#E60026"/>
      <rect x="7" width="6" height="20" fill="#FFFFFF"/>
      <rect x="13" width="7" height="20" fill="#0044CC"/>
    </pattern>
    <clipPath id="pole-clip">
      <rect x="16" y="10" width="32" height="44" rx="4" ry="4"/>
    </clipPath>
  </defs>
  <!-- Base caps -->
  <rect x="12" y="4" width="40" height="6" rx="2" fill="#121212" stroke="#121212" stroke-width="2"/>
  <rect x="12" y="54" width="40" height="6" rx="2" fill="#121212" stroke="#121212" stroke-width="2"/>
  <!-- Pole cylinder with stripes -->
  <rect x="16" y="10" width="32" height="44" rx="4" fill="url(#barber-stripes)" stroke="#121212" stroke-width="3"/>
</svg>
